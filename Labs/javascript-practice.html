<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice Lab</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1>JavaScript Practice Lab</h1>
        <p>Explore how a webpage responds to user actions.</p>

        <section class="card p-4 mb-4" aria-labelledby="contentHeading">
            <h2 id="contentHeading">Part 2: Change Content</h2>
            <p id="message">Click the button to learn more.</p>
            <button type="button" class="btn btn-primary" onclick="changeMessage()">Learn More</button>
        </section>

        <section class="card p-4 mb-4" aria-labelledby="formHeading">
            <h2 id="formHeading">Part 3: Respond to Input</h2>
    
            <form id="greetingForm" onsubmit="greetVisitor(); return false;">
                <div class="mb-3">
                    <!-- Changed: clearer label. for "visitorName matches the input id below"-->
                    <label for="visitorName" class="form-label">Enter your first name so I can greet you:</label>
                    <!-- Chnaged: added a placeholder and mb-2 spacing. id ="visitorName is unchanged because the Java uses it."-->
                    <input type="text" id="visitorName" class="form-control mb-2" placeholder="Example: Olivia">
                </div>
                <button type="submit" class="btn btn-success">Submit</button>
            </form>
            <p id="greeting" class="mt-3" aria-live="polite"></p>
        </section>
    </main>

    <!-- jQuery: included for consistency with the earlier website module;
         this lab uses plain JavaScript, not jQuery. -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JavaScript bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Our JavaScript comes after the libraries and page content. -->
    <script>

            // Runs when the Learn More button is clicked (onclick"changeMessage()"").
            function changeMessage () {
                //Find the paragrpah with id="message" and replace its visable text.
                document.getElementById("message"). textContent =
                "I clicked a button and JavaScript changed this text!";
        }
// Runs when the form is submitted (onsubmit="greetVisitor(); return false;").
function greetVisitor() {
    // .value reads what the visitor typed; let name stores it.
    // trim() removes spaces at the beginning and end of what was typed.
    let name = document.getElementById("visitorName").value.trim();

    // === compares values. An empty name gets a helpful prompt instead.
    if (name === "") {
        document.getElementById("greeting").textContent =
            "Please enter your name.";
    } else {
        // A name was entered, so display the welcome message.
        document.getElementById("greeting").textContent =
            "Welcome, " + name + "!";
    }
}
    </script>
</body>
</html>
